<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu</title>
    <script src="forgot-password.js" defer></script>
    <link rel="stylesheet" href="forgot-password.css"> </head>
<body>
    <div class="forgot-container">
        <div class="forgot-box">
            <h2>Khôi phục mật khẩu</h2>
            <p class="subtitle">Vui lòng nhập email và mật khẩu mới của bạn</p>

            <div class="input-group">
                <input type="email" id="forgot-email" placeholder="Nhập Email đã đăng ký">
            </div>

            <div class="input-group">
                <input type="password" id="new-password" placeholder="Mật khẩu mới (ít nhất 8 ký tự)">
            </div>

            <div class="input-group">
                <input type="password" id="confirm-new-password" placeholder="Xác nhận mật khẩu mới">
            </div>

            <button class="btn-reset" onclick="resetPassword()">Đổi mật khẩu</button>
            
            <p id="reset-message" class="message"></p>
            
            <div class="back-to-login">
                <a href="login.html">← Quay lại Đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
