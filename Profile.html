<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="User.css"> 
    <link rel="stylesheet" href="Profile.css"> </head>
<body>
    <div class="dashboard">
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-wallet"></i>
            <h2>Expense Student</h2>
        </div>
        <ul class="menu">
            <li><a href="User.html"><i class="fa-solid fa-camera"></i> <span>Tổng quan</span></a></li>
            <li><a><i class="fa-solid fa-layer-group"></i> <span>Danh mục</span></a></li>
            <li><a href="expense.html"><i class="fa-solid fa-file-invoice"></i> <span>Chi tiêu</span></a></li>
            <li><a><i class="fa-solid fa-bullseye"></i> <span>Mục tiêu</span></a></li>
            <li class="active"><a href="profile.html"><i class="fa-regular fa-user"></i> <span>Trang cá nhân</span></a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="profile-card">
            <h3>Cập nhật tài khoản</h3>
            <p>Chỉnh sửa thông tin tài khoản của bạn</p>

            <div class="avatar-section">
                <img id="userAvatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
                <button type="button" class="btn-change-avatar">Đổi Avatar</button>
            </div>

            <form id="profileForm">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="name" placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" disabled>
                </div>
                <div class="form-group">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" id="oldPassword" placeholder="••••••">
                </div>
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-save">Lưu thay đổi</button>
                    <button type="button" class="btn-cancel" onclick="location.href='User.html'">Hủy</button>
                </div>
            </form>
        </div>
    </main>
</div>

    <script src="Profile.js"></script>
</body>

</html>
